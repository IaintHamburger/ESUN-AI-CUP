name: Simple agent tests
on:
  pull_request:
    paths: ['simple_agent/**', 'run_simple.py', 'requirements-simple.txt', 'tests/**', '.github/workflows/simple-agent-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-simple.txt
      - run: python -m pip install -r requirements-simple.txt
      - run: python -m unittest discover -s tests -v
      - run: python run_simple.py demo
